# On every push and pull request:
#   - the web data matches styles/
#   - visual snapshots (tools/snapshots.py): which cards draw differently from
#     tests/snapshots/. This is for review and never fails the build. Changed
#     cards are listed in the job summary and their before/after pictures
#     uploaded as the "snapshot-diffs" artifact. On a pull request (from a
#     branch of this repo) the pictures are also pushed to the
#     `snapshot-diffs` branch and shown in a PR comment, which later runs edit
#     in place.
#   - the rest of the tests, including the JS engine's parity with Python
#   - on main, after the tests pass: changed snapshots are accepted, i.e.
#     regenerated and committed to main. Merging a PR is what accepts its
#     visual changes; nobody needs to run --update by hand.

name: CI

on:
  push:
    branches-ignore: [snapshot-diffs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # push diff pictures to snapshot-diffs; commit accepted snapshots to main
  pull-requests: write # comment on the pull request

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install the package and test dependencies
        run: pip install ".[dev]"

      - name: Check the committed web data matches styles/
        run: python tools/build_web.py --check

      - name: Visual snapshots
        id: snapshots
        env:
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/snapshot-diffs/pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: python tools/snapshots.py --diff snapshot-diffs --report snapshot-report.md --image-url "$IMAGE_URL" --no-fail

      - name: Upload snapshot diffs
        if: steps.snapshots.outputs.changed != '0'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: snapshot-diffs/

      - name: Publish diff pictures for the PR comment
        continue-on-error: true # cosmetic: never stops the tests
        if: >-
          steps.snapshots.outputs.changed != '0' && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEST: pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          mkdir pub && cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          for try in 1 2 3; do
            if git fetch -q --depth 1 origin snapshot-diffs; then
              git checkout -q -B snapshot-diffs FETCH_HEAD
            else
              git checkout -q --orphan snapshot-diffs
            fi
            mkdir -p "$DEST" && cp ../snapshot-diffs/*.png "$DEST/"
            git add "$DEST"
            git commit -qm "Snapshot diffs: $DEST"
            git push -q origin snapshot-diffs && exit 0
            sleep 5 # another run pushed first: start again from its commit
          done
          exit 1

      - name: Comment on the pull request
        continue-on-error: true # cosmetic: never stops the tests
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && steps.snapshots.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ steps.snapshots.outputs.changed }}
        run: |
          if [ "$CHANGED" != 0 ]; then
            gh pr comment "$PR" --edit-last --create-if-none --body-file snapshot-report.md
          else
            # all clear: update an earlier report if there is one, but don't add a comment
            gh pr comment "$PR" --edit-last --body-file snapshot-report.md || true
          fi

      - name: Test
        run: python -m pytest -q

      - name: Accept the snapshot changes on main
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
          && steps.snapshots.outputs.changed != '0'
        run: |
          python tools/snapshots.py --update > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/snapshots
          git commit -qm "Update visual snapshots for ${GITHUB_SHA::7}"
          # if main has moved on meanwhile, the run for the newer commit does this instead
          git push -q origin HEAD:main || echo "::notice::main moved on; its own run will update the snapshots"
